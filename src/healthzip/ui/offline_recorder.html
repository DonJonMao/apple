<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HealthZIP 离线训练记录</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182d28;background:#f2f6f4}body{max-width:760px;margin:auto;padding:16px}h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}section,article,details{background:white;border:1px solid #d9e5de;border-radius:12px;padding:14px;margin:12px 0}label{display:block;margin:9px 0;font-size:.9rem}input,select,textarea,button{font:inherit;border:1px solid #b9cec2;border-radius:7px;padding:10px;box-sizing:border-box}input,select,textarea{display:block;width:100%;margin-top:5px}button{background:#f0f5f2;color:#183d2b;cursor:pointer;margin:5px 5px 5px 0}button.primary{background:#16643d;color:white}button:disabled{opacity:.45}p,small{line-height:1.5}small{color:#53665b}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badge{background:#e1f1e7;padding:4px 8px;border-radius:12px}.error{color:#a42626;white-space:pre-wrap}.notice{color:#385948}.set{border-left:4px solid #b6d8c5}input[type=checkbox]{width:auto;display:inline}.muted{opacity:.7}@media(max-width:420px){.row{grid-template-columns:1fr}body{padding:9px}}
</style></head><body>
<h1>HealthZIP 离线训练记录</h1><p>在这台设备保存草稿，连接电脑接收器后重试。无需手表或 AI。</p><div id="notice" class="notice" role="status"></div>
<details id="connection"><summary>连接与本机保存</summary>
<label>电脑接收器地址<input id="base" placeholder="http://192.168.1.20:8765" inputmode="url"></label>
<label>接收器 token<input id="token" type="password" autocomplete="off"></label>
<button id="connect">连接并缓存目录</button><button id="cacheMedia">缓存已下载示范媒体</button><button id="sync" class="primary">同步待发送记录</button><button id="download">下载独立离线页面</button>
<p><small>在本机或可信局域网使用。token、草稿和缓存只存当前浏览器。先下载独立 HTML、打开并连接一次，即可断网记录和刷新；普通局域网页面在服务器关闭后重新打开不保证可用。本页不使用云端、外部字体或分析服务。</small></p>
<button id="export">导出本机记录备份</button><label>恢复本机备份<input id="import" type="file" accept="application/json"></label><button id="clear">清除这台设备的缓存</button>
</details>
<section><h2>开始训练</h2><label>训练名称<input id="sessionName" placeholder="临时训练"></label><label>选择模板<select id="template"></select></label><button id="start" class="primary">开始新训练</button><label>恢复本机或已缓存训练<select id="resume"></select></label><button id="openSession">继续所选训练</button></section>
<main id="active"></main><section><h2>同步状态</h2><p id="queueCount"></p><div id="conflicts"></div><div id="failures" class="error"></div></section>
<script>
'use strict';
const PUBLIC_CATALOG=__PUBLIC_CATALOG_JSON__;
const CATALOG_SNAPSHOT=__CATALOG_SNAPSHOT_JSON__;
const KEY='healthzip.training.offline.v1.3';
const MEDIA_STATUS_LABELS=__MEDIA_STATUS_LABELS_JSON__;
const CHINESE_NAME_STATUS_LABELS=__CHINESE_NAME_STATUS_LABELS_JSON__;
const uuid=()=>{if(crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;return [...b].map((v,i)=>([4,6,8,10].includes(i)?'-':'')+v.toString(16).padStart(2,'0')).join('')};
const now=()=>{const d=new Date(),off=-d.getTimezoneOffset(),sign=off>=0?'+':'-',pad=x=>String(Math.floor(Math.abs(x))).padStart(2,'0');return new Date(d.getTime()+off*60000).toISOString().slice(0,23)+sign+pad(off/60)+':'+pad(off%60)};
const empty=()=>({version:'1.3.0',device_id:uuid(),base:location.protocol.startsWith('http')?location.origin:'',token:'',catalog:PUBLIC_CATALOG,catalog_snapshot_id:CATALOG_SNAPSHOT,catalog_public_ids:PUBLIC_CATALOG.map(x=>x.exercise_id),catalog_definitions:[],equipment:[],templates:[],sessions:[],active:null,outbox:[],conflicts:[],last_error:null});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||empty()}catch(e){state=empty()}
let syncing=false;
function el(tag,text,attrs={}){const n=document.createElement(tag);if(text!==null&&text!==undefined)n.textContent=text;for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v)}return n}
function say(text,error=false){const n=document.getElementById('notice');n.textContent=text;n.className=error?'error':'notice'}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({...state,catalog:state.catalog.map(compactExercise)}));document.getElementById('queueCount').textContent=`${state.outbox.length} 个事件待同步；本机保存 ${state.sessions.length} 场训练。`}catch(e){say('本机存储失败，请立即导出备份；当前浏览器可能禁用存储或空间不足。',true);throw e}}
function enqueue(operation,args){const event={event_id:uuid(),operation,arguments:JSON.parse(JSON.stringify(args))};state.outbox.push(event);persist();return event.event_id}
function field(parent,label,value='',type='text'){const l=el('label',label),n=el('input',null,{type,'aria-label':label});n.value=value??'';l.append(n);parent.append(l);return n}
function choose(parent,label,options,value){const l=el('label',label),n=el('select',null,{'aria-label':label});for(const o of options){const[k,t]=Array.isArray(o)?o:[o,o];const opt=el('option',t,{value:k});n.append(opt)}if(value!==undefined)n.value=value;l.append(n);parent.append(l);return n}
function button(parent,text,fn,primary=false){const b=el('button',text,{class:primary?'primary':''});b.onclick=async()=>{try{await fn()}catch(e){say(e.message,true)}};parent.append(b);return b}
function compactExercise(x){return Object.fromEntries(['exercise_id','definition_version','name','name_zh','name_en','names','recording_mode','equipment_type','default_load_basis','aliases_zh','user_aliases','derived_from','source','media','description','description_language','display_regions','movement_patterns','side','variant_notes'].filter(k=>x[k]!==undefined).map(k=>[k,x[k]]))}
const equipmentNames=__EQUIPMENT_LABELS_JSON__;
const regionNames=__REGION_LABELS_JSON__;
const patternNames=__PATTERN_LABELS_JSON__;
function labelExercise(x){return x.name||x.name_zh||x.exercise_id}
const bases=[['unknown','未知口径'],['external_total_kg','含杆总重'],['plates_per_side_kg','单边片重'],['per_dumbbell_kg','每只哑铃'],['dumbbells_total_kg','两只哑铃合计'],['single_implement_kg','单件器具'],['machine_setting','器械刻度'],['bodyweight_no_external','自重，无额外负重'],['added_load_kg','额外负重'],['assistance_setting','助力设置'],['band_configuration','弹力带配置']];
function refreshSelections(){const t=document.getElementById('template');t.replaceChildren(el('option','临时训练，不使用模板',{value:''}));for(const x of state.templates)t.append(el('option',x.name+' · v'+x.version,{value:x.id}));const r=document.getElementById('resume');r.replaceChildren();for(const x of state.sessions.slice().reverse())r.append(el('option',x.name+' · '+x.started_at.slice(0,16)+' · '+x.status,{value:x.uuid}));if(state.active)r.value=state.active}
function current(){return state.sessions.find(s=>s.uuid===state.active)}
function addInstance(s,exercise,condition,targets={},version=null,assignedId=null,slots=[]){const instance={id:assignedId||uuid(),exercise,condition,targets,sets:[]};s.exercises.push(instance);enqueue('add_exercise',{session_id:s.uuid,exercise_id:exercise.exercise_id,session_exercise_id:instance.id,condition,targets,populate_sets:false,definition_version:version||exercise.definition_version||1});for(const [i,target] of (targets.sets||[]).entries())addDraft(instance,{},target,slots[i]?.set_uuid);return instance}
function addDraft(instance,suggestion={},planned={},assignedId=null){const set={uuid:assignedId||uuid(),revision:1,planned,actual:{completion_state:'draft',load_unit:'kg',...suggestion},deleted:false};set.actual.completion_state='draft';instance.sets.push(set);enqueue('add_set',{session_exercise_id:instance.id,set_id:set.uuid,actual:set.actual,planned});return set}
function start(){const template=state.templates.find(x=>x.id===document.getElementById('template').value);const s={uuid:uuid(),name:document.getElementById('sessionName').value.trim()||(template?template.name:'临时训练'),started_at:now(),status:'in_progress',revision:1,exercises:[]};const assignments=(template?.items||[]).map(item=>({item,instanceId:uuid(),slots:(item.targets.sets||[]).map(target=>({set_uuid:uuid(),targets:target,exercise_id:item.exercise_id}))}));for(const a of assignments)for(const slot of a.slots)slot.session_exercise_id=a.instanceId;state.sessions.push(s);state.active=s.uuid;enqueue('start_session',{name:s.name,session_id:s.uuid,started_at:s.started_at,template_id:template?.id||null,template_version:template?.version||null,populate_template:false,client_plan_slots:template?assignments.flatMap(x=>x.slots):null});for(const assignment of assignments){const item=assignment.item,exercise=item.exercise_snapshot||(state.catalog_definitions||[]).find(x=>x.exercise_id===item.exercise_id&&x.definition_version===item.definition_version)||state.catalog.find(x=>x.exercise_id===item.exercise_id&&x.definition_version===item.definition_version);if(!exercise||exercise.exercise_id!==item.exercise_id||exercise.definition_version!==item.definition_version)throw Error('缓存模板动作缺失或版本不一致，请连接更新目录');addInstance(s,exercise,item.condition,item.targets,item.definition_version,assignment.instanceId,assignment.slots)}persist();render()}
function render(){refreshSelections();const root=document.getElementById('active');root.replaceChildren();const s=current();if(!s){root.append(el('p','选择模板或直接开始临时训练。'));renderSync();return}root.append(el('h2',s.name));root.append(el('p',`${s.started_at.slice(0,16)} · ${s.status} · ${s.exercises.flatMap(x=>x.sets).filter(x=>!x.deleted&&x.actual.completion_state==='completed').length} 组已确认完成`));if(s.status!=='completed'){renderAdd(root,s)}for(const x of s.exercises)renderInstance(root,s,x);const end=el('section');const notes=field(end,'结束反馈 / 未完成原因',s.feedback||'');const rpe=field(end,'整次训练 RPE 0–10（可留空）','','number');const minutes=field(end,'整次训练时长分钟（可留空）','','number');button(end,'结束并保存反馈',()=>{const rp=number(rpe.value),mi=number(minutes.value);if(rp!==null&&(rp<0||rp>10))throw Error('整次RPE须为0–10');s.status='completed';s.feedback=notes.value;enqueue('end_session',{session_id:s.uuid,ended_at:now(),feedback:{notes:s.feedback},session_rpe:rp,rpe_scale:rp===null?null:'cr10',duration_seconds:mi===null?null:mi*60,duration_protocol:mi===null?null:'user_elapsed_including_rest',base_revision:s.revision});s.revision++;persist();render()},true);root.append(end);renderSync();persist()}
function renderAdd(root,s){
 const panel=el('details');panel.append(el('summary','添加动作或自定义动作'));
 const search=field(panel,'搜索动作 / 别名'),select=choose(panel,'动作',[]);
 function options(){
  select.replaceChildren();
  for(const x of state.catalog.filter(x=>(labelExercise(x)+' '+(x.name_en||'')+' '+x.exercise_id+' '+(x.aliases_zh||[]).join(' ')+' '+(x.user_aliases||[]).join(' ')).toLowerCase().includes(search.value.toLowerCase())))
   select.append(el('option',labelExercise(x)+' · '+(equipmentNames[x.equipment_type]||x.equipment_type),{value:x.exercise_id}));
  select.append(el('option','＋ 自定义动作',{value:'custom'}));
 }
 options();
 const copy=field(panel,'复制为我的动作变式',null,'checkbox');
 const definition=el('section');definition.append(el('h3','个人动作定义'));
 definition.append(el('small','部位和动作模式仅用于归类；新动作及个人变式的专业关系保持待审核。'));
 const custom=field(definition,'自定义动作名称（选自定义时填写）');
 const mode=choose(definition,'记录模式',[['','请选择记录模式'],['repetitions','次数'],['duration','持续秒数'],['distance','距离米']],'repetitions');
 const equipmentType=choose(definition,'自定义器械类型',Object.entries(equipmentNames),'other');
 const regions=choose(definition,'自定义动作部位（可多选）',Object.entries(regionNames));regions.multiple=true;regions.size=4;
 const patterns=choose(definition,'自定义动作模式（可多选）',Object.entries(patternNames));patterns.multiple=true;patterns.size=5;
 const variantNotes=field(definition,'动作变式说明');
 panel.append(definition);
 const equipment=choose(panel,'已缓存器械实例',[['','未知 / 新器械'],...state.equipment.map(x=>[x.id,x.label])]);
 const newEquipment=field(panel,'新器械名称（选未知则保留空白）');
 const basis=choose(panel,'重量口径',bases,'unknown');
 const confirmed=field(panel,'我确认上述重量口径',null,'checkbox');
 const side=choose(panel,'侧别',[['unknown','未知'],['both','双侧'],['left','左侧'],['right','右侧'],['alternating','交替']]);
 const semantics=choose(panel,'次数含义',[['unknown','未知'],['simultaneous','同时完成'],['per_limb','每侧分别'],['alternating_total','交替总次数'],['not_applicable','不适用']]);
 const rom=field(panel,'幅度协议（未知留空）');
 const settings=field(panel,'角度 / 座椅 / 握法等设置');
 const settingsOK=field(panel,'已确认影响比较的动作设置',null,'checkbox');
 const symmetric=field(panel,'两侧对称配重',null,'checkbox');
 const bar=field(panel,'有效杆重 kg（未知留空）','','number');
 const detail=el('section');panel.append(detail);
 function populateDefinition(x){
  custom.value=x?labelExercise(x)+(x.recording_mode==='unknown'?'（我的记录）':'（我的变式）'):'';
  mode.value=x?(x.recording_mode==='unknown'?'':x.recording_mode):'repetitions';
  equipmentType.value=x?.equipment_type in equipmentNames?x.equipment_type:'other';
  for(const option of regions.options)option.selected=(x?.display_regions||[]).includes(option.value);
  for(const option of patterns.options)option.selected=(x?.movement_patterns||[]).includes(option.value);
  variantNotes.value='';
 }
 function refresh(){
  const x=state.catalog.find(x=>x.exercise_id===select.value);
  copy.disabled=!x||!(state.catalog_public_ids||[]).includes(x.exercise_id);
  if(copy.disabled)copy.checked=false;
  definition.hidden=!!x&&!copy.checked&&x.recording_mode!=='unknown';
  populateDefinition(x);
  basis.value=x?.default_load_basis||'unknown';confirmed.checked=false;
  side.value=x?.side||'unknown';
  if(x)showCatalogDetail(detail,x);
  else{detail.replaceChildren();detail.append(el('p','私人动作只保存在本机和你的训练数据库中。'))}
 }
 select.onchange=refresh;copy.onchange=refresh;search.oninput=()=>{options();refresh()};refresh();
 button(panel,'加入本次训练',()=>{
  let exercise=state.catalog.find(x=>x.exercise_id===select.value);
  const needsDefinition=select.value==='custom'||copy.checked||exercise?.recording_mode==='unknown';
  if(!exercise&&!needsDefinition)throw Error('请选择动作');
  if(needsDefinition&&(!custom.value.trim()||!mode.value))throw Error('请填写自定义动作名称并明确选择记录模式');
  if(basis.value!=='unknown'&&!confirmed.checked)throw Error('请确认负荷口径，或选择未知');
  const barMass=number(bar.value);
  if(needsDefinition){
   const origin=exercise;
   exercise={exercise_id:'custom.'+uuid(),definition_version:1,name_zh:custom.value.trim(),recording_mode:mode.value,equipment_type:equipmentType.value,default_load_basis:basis.value,display_regions:[...regions.selectedOptions].map(x=>x.value),movement_patterns:[...patterns.selectedOptions].map(x=>x.value),side:side.value,variant_notes:variantNotes.value.trim()||null,derived_from:origin?{exercise_id:origin.exercise_id,definition_version:origin.definition_version,source:origin.source}:null};
   state.catalog.push(exercise);
   enqueue('create_exercise',{name:exercise.name_zh,recording_mode:exercise.recording_mode,equipment_type:exercise.equipment_type,load_basis:exercise.default_load_basis,exercise_id:exercise.exercise_id,regions:exercise.display_regions,movement_patterns:exercise.movement_patterns,side:exercise.side,variant_notes:exercise.variant_notes,derived_from:exercise.derived_from});
  }
  let machine=equipment.value||null;
  if(newEquipment.value.trim()){
   machine=uuid();const config={id:machine,label:newEquipment.value.trim(),equipment_type:exercise.equipment_type};state.equipment.push(config);
   enqueue('create_equipment',{equipment_id:machine,label:config.label,equipment_type:config.equipment_type});
  }
  const condition={equipment_instance_id:machine,load_basis:basis.value,load_basis_confirmed:confirmed.checked,side:side.value,repetition_semantics:semantics.value,rom_protocol:rom.value||null,settings:{description:settings.value},settings_confirmed:settingsOK.checked,symmetric_loading:symmetric.checked,effective_bar_mass_kg:barMass};
  const instance=addInstance(s,exercise,condition);addDraft(instance);persist();render();
 },true);
 root.append(panel);
}
function number(value,integer=false){if(value===''||value===null||value===undefined)return null;const n=Number(value);if(!Number.isFinite(n)||n<0||(integer&&!Number.isInteger(n)))throw Error('请填写有限非负'+(integer?'整数':'数值'));return n}
function renderInstance(root,s,instance){const article=el('article');article.append(el('h3',labelExercise(instance.exercise)));article.append(el('small',(bases.find(x=>x[0]===instance.condition.load_basis)||['','未知口径'])[1]));for(const set of instance.sets){const box=el('section',null,{class:'set'});if(set.deleted){box.append(el('p','已删除，撤销会新增修订'));button(box,'撤销删除',()=>{enqueue('undo_event',{original_event_id:set.delete_event_id,base_revision:set.revision});set.revision++;set.deleted=false;persist();render()});article.append(box);continue}box.append(el('p',`第 ${instance.sets.indexOf(set)+1} 组 · ${set.actual.completion_state}`));if(set.planned?.reps_min||set.planned?.reps_max)box.append(el('small',`目标 ${set.planned.reps_min??'—'}–${set.planned.reps_max??'—'} 次；目标不等于已完成`));const draft=set.local_draft||{...set.actual};set.local_draft=draft;const load=field(box,'重量 / 刻度',draft.load_value??'','number');const mode=instance.exercise.recording_mode,measure={repetitions:'reps',duration:'duration_s',distance:'distance_m'}[mode];const qty=field(box,{repetitions:'实际次数',duration:'持续秒数',distance:'距离米'}[mode],draft[measure]??'','number');const unit=choose(box,'单位',['kg','lb','stack_level'],draft.load_unit||'kg');const rir=field(box,'实际 RIR（未知留空）',draft.rir??'','number');const type=choose(box,'组类型',[['work','工作组'],['warmup','热身'],['assessment','测试'],['other','其他']],draft.set_type||'work');const stop=choose(box,'停止原因',[['unknown','未记录'],['plan_target','完成计划'],['target_rir','达到目标余力'],['volitional_failure','自愿力竭'],['technical_limit','技术限制'],['pain','疼痛'],['other','其他']],draft.stop_reason||'unknown');const quality=choose(box,'动作质量',[['','未记录'],['acceptable','达到本次动作要求'],['technique_limited','技术限制'],['unknown','无法判断']],draft.quality_status||'');function saveLocal(){Object.assign(draft,{load_value:load.value,load_unit:unit.value,[measure]:qty.value,rir:rir.value,set_type:type.value,stop_reason:stop.value,quality_status:quality.value||null});persist()}for(const n of [load,unit,qty,rir,type,stop,quality])n.oninput=saveLocal;function submit(status){saveLocal();const values={load_value:number(load.value),load_unit:unit.value,[measure]:number(qty.value,measure==='reps'),rir:number(rir.value),set_type:type.value,stop_reason:stop.value,quality_status:quality.value||null,completion_state:status};if(status==='completed'&&!(values[measure]>0))throw Error('完成组须有正数完成量；失败可记录0并选择中止');if(status==='completed'||status==='aborted')values.ended_at=now();enqueue('edit_set',{set_id:set.uuid,changes:values,base_revision:set.revision});Object.assign(set.actual,values);set.revision++;delete set.local_draft;persist();render()}button(box,'保存草稿',()=>submit('draft'));button(box,'确认完成',()=>submit('completed'),true);button(box,'失败 / 中止',()=>submit('aborted'));button(box,'跳过',()=>submit('skipped'));if(!set.actual.reference_set&&['draft','in_progress'].includes(set.actual.completion_state))button(box,'预先指定参考组',()=>{enqueue('edit_set',{set_id:set.uuid,changes:{reference_set:true},base_revision:set.revision});set.actual.reference_set=true;set.revision++;persist();render()});button(box,'复制为新组草稿',()=>{addDraft(instance,{load_value:load.value||null,load_unit:unit.value,[measure]:qty.value||null});persist();render()});button(box,'删除（可撤销）',()=>{set.delete_event_id=enqueue('delete_set',{set_id:set.uuid,base_revision:set.revision});set.deleted=true;set.revision++;persist();render()});article.append(box)}if(s.status!=='completed')button(article,'新增一组草稿',()=>{addDraft(instance);persist();render()});root.append(article)}

function mediaDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('healthzip.public.media',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function cachedMedia(hash,blob){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction('blobs',blob?'readwrite':'readonly'),store=tx.objectStore('blobs'),r=blob?store.put(blob,hash):store.get(hash);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function showCatalogDetail(panel,item){
 panel.replaceChildren();panel.append(el('p',item.name_en||labelExercise(item)));
 const zh=item.names?.['zh-CN'];
 if(zh||item.source?.provider==='wger'){
  panel.append(el('small','中文名称：'+(CHINESE_NAME_STATUS_LABELS[zh?.review_status]||CHINESE_NAME_STATUS_LABELS.unknown)));
  if(zh?.untranslated_terms?.length)panel.append(el('small','保留待翻译术语：'+zh.untranslated_terms.join(', ')));
 }
 if(item.description)panel.append(el('p',item.description));
 panel.append(el('small','来源分类与社区说明仅用于动作导航；不代表教材核对或刺激权重。'));
 const media=item.media||[];
 if(media.some(m=>m.fetch_status==='ready'))button(panel,'缓存此动作示范',()=>cacheAllMedia([item]));
 if(!media.length)panel.append(el('p','暂无动作示范：来源没有此动作的图片或视频。'));
 for(const m of media){
  panel.append(el('small',(m.media_type==='video'?'视频':'图片')+' · '+(MEDIA_STATUS_LABELS[m.fetch_status]||'媒体状态未知')+' · '+m.attribution_text));
  if(m.fetch_status!=='ready'||!m.blob_hash)continue;
  const isVideo=m.media_type==='video',node=el(isVideo?'video':'img');
  if(isVideo){node.controls=true;panel.append(el('small','视频保留来源编码；HEVC 等格式需要浏览器或播放器支持。'))}
  node.style.maxWidth='100%';
  const unavailable=message=>{
   if(!node.parentNode)return;
   const fallback=el('div');fallback.append(el('p',message));
   const source=node.currentSrc||node.src;
   if(isVideo&&source){
    const filename=(m.original_url||'').split('/').pop()?.split('?')[0]||'exercise-video';
    fallback.append(el('a','下载原视频，用兼容播放器打开',{href:source,download:filename}));
    node.onerror=null;node.onloadeddata=null;node.onplaying=null;node.pause();
   }
   node.replaceWith(fallback);
  };
  node.onerror=()=>unavailable(isVideo?'当前浏览器无法播放此视频，可能不支持其格式或编码，也可能是文件不可用。可用兼容播放器打开原文件；仍可记录动作。':'示范未缓存或文件不可用；仍可记录动作。');
  if(isVideo){
   const checkPicture=()=>{if(node.readyState>=2&&(!node.videoWidth||!node.videoHeight))unavailable('当前浏览器无法显示此视频的画面，可能仅支持其中的音轨。请下载原文件，使用支持其格式或编码的播放器打开；仍可记录动作。')};
   node.onloadeddata=checkPicture;node.onplaying=checkPicture;
  }
  panel.append(node);
  try{
   const cached=await cachedMedia(m.blob_hash);
   if(cached)node.src=URL.createObjectURL(cached);
   else if(location.protocol==='file:'&&m.package_path)node.src=m.package_path;
   else node.replaceWith(el('p','本机尚未缓存此示范。'));
  }catch(e){node.replaceWith(el('p','媒体缓存不可用；可使用完整离线目录包。'))}
 }
}
async function cacheAllMedia(items=state.catalog){configuration();let count=0;for(const item of items)for(const m of item.media||[]){if(m.fetch_status!=='ready'||!m.blob_hash)continue;if(await cachedMedia(m.blob_hash))continue;const response=await fetch(state.base+'/v1/training/media/'+m.blob_hash,{headers:{'X-HealthZip-Token':state.token},credentials:'omit'});if(!response.ok)throw Error('本地媒体服务读取失败');const blob=await response.blob();await cachedMedia(m.blob_hash,blob);count++;say('已缓存 '+count+' 项媒体；目录和训练草稿独立保存。')}say('本机示范媒体缓存完成，断网重启仍可读取。')}

function renderSync(){document.getElementById('queueCount').textContent=`${state.outbox.length} 个事件待同步；本机保存 ${state.sessions.length} 场训练。`;document.getElementById('failures').textContent=state.last_error||'';const area=document.getElementById('conflicts');area.replaceChildren();for(const c of state.conflicts){const box=el('article');box.append(el('p','同一组出现另一版本，原事实未被覆盖。'));box.append(el('p',`当前：${c.current?.load_value??'未知'} ${c.current?.load_unit||''} × ${c.current?.reps??'未知'}；提交：${c.proposed?.load_value??'未改'} × ${c.proposed?.reps??'未改'}`));for(const[choice,label]of [['keep_current','保留当前'],['apply_proposed','应用我的更改']])button(box,label,()=>{const event={event_id:uuid(),operation:'resolve_conflict',arguments:{conflict_id:c.conflict_id,choice}};state.outbox.unshift(event);state.conflicts=state.conflicts.filter(x=>x.conflict_id!==c.conflict_id);persist();render();sync()},false);area.append(box)}}
function configuration(){const url=new URL(document.getElementById('base').value.trim());if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw Error('请输入本机或可信局域网 HTTP 地址');state.base=url.origin;state.token=document.getElementById('token').value.trim();if(!state.token)throw Error('请填写接收器 token');persist()}
async function request(path,body){configuration();const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(state.base+path,{method:body?'POST':'GET',headers:{'X-HealthZip-Token':state.token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal,credentials:'omit'});const data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);return data}finally{clearTimeout(timeout)}}
function importSession(server){return {uuid:server.session_uuid,name:server.name,started_at:server.started_at,status:server.session_status||'completed',revision:server.revision,exercises:(server.exercises||[]).map(x=>({id:x.id,exercise:x.exercise,condition:x.condition,targets:x.planned,sets:x.sets.map(r=>({uuid:r.set_uuid,revision:r.revision,planned:r.planned||{},actual:Object.fromEntries(['completion_state','load_value','load_unit','reps','duration_s','distance_m','rir','stop_reason','set_type','reference_set','quality_status'].map(k=>[k,r[k]])),deleted:!!r.deleted_at}))}))}}
async function connect(){const data=await request('/v1/training/bootstrap');await cachedMedia('catalog:'+data.catalog_snapshot_id,{catalog:data.catalog});const pendingIds=new Set(state.outbox.filter(x=>x.operation==='create_exercise').map(x=>x.arguments.exercise_id)),serverIds=new Set(data.catalog.map(x=>x.exercise_id));state.catalog=[...data.catalog,...state.catalog.filter(x=>pendingIds.has(x.exercise_id)&&!serverIds.has(x.exercise_id))];state.catalog_snapshot_id=data.catalog_snapshot_id;state.catalog_public_ids=data.catalog_public_ids||[];state.catalog_definitions=data.catalog_definitions||[];state.templates=data.templates;state.equipment=data.equipment;for(const s of data.sessions){if(s.session_uuid&&!state.sessions.some(x=>x.uuid===s.session_uuid))state.sessions.push(importSession(s))}persist();render();say('目录、模板和最近训练已缓存在这台设备。可断网继续记录。')}
async function sync(){if(syncing)return;syncing=true;try{configuration();while(state.outbox.length){const event=state.outbox[0],data=await request('/v1/training/events',{device_id:state.device_id,events:[event]}),receipt=data.results?.[0];if(!receipt)throw Error('接收器未返回事件回执，已保留原事件 ID');if(receipt.status==='failed'){state.last_error=receipt.error;persist();throw Error(receipt.error)}state.outbox.shift();state.last_error=null;if(receipt.status==='conflicted'){state.conflicts.push(receipt.result);persist();render();throw Error('发现版本冲突；请选择保留哪一版本后再同步')}const result=receipt.result;if(result?.set_uuid){for(const s of state.sessions)for(const x of s.exercises)for(const r of x.sets)if(r.uuid===result.set_uuid)r.revision=Math.max(r.revision,result.revision)}persist()}say('全部待发送事件已收到回执；重复请求不会增加真实训练组。');render()}catch(e){say('同步未完成：'+e.message+'。草稿和原事件仍在本机。',true)}finally{syncing=false}}
function download(name,content,type){const a=el('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
document.getElementById('base').value=state.base;document.getElementById('token').value=state.token;
document.getElementById('start').onclick=()=>{try{start()}catch(e){say(e.message,true)}};
document.getElementById('openSession').onclick=()=>{state.active=document.getElementById('resume').value;persist();render()};
document.getElementById('cacheMedia').onclick=()=>cacheAllMedia().catch(e=>say(e.message,true));
document.getElementById('connect').onclick=()=>connect().catch(e=>say(e.message,true));document.getElementById('sync').onclick=sync;
document.getElementById('download').onclick=()=>{const doc=document.documentElement.cloneNode(true);const script=doc.querySelector('script');const publicIds=new Set(state.catalog_public_ids||PUBLIC_CATALOG.map(x=>x.exercise_id));const publicItems=state.catalog.filter(x=>publicIds.has(x.exercise_id)).map(x=>{const y=compactExercise(x);delete y.user_aliases;return y});const a=script.textContent.indexOf('const PUBLIC_CATALOG='),b=script.textContent.indexOf('const KEY=',a);script.textContent=script.textContent.slice(0,a)+'const PUBLIC_CATALOG='+JSON.stringify(publicItems).replaceAll('<','\\u003c')+';\nconst CATALOG_SNAPSHOT='+JSON.stringify(state.catalog_snapshot_id)+';\n'+script.textContent.slice(b);doc.querySelector('#base').setAttribute('value','');doc.querySelector('#token').setAttribute('value','');doc.querySelector('#active').replaceChildren();doc.querySelector('#conflicts').replaceChildren();doc.querySelector('#notice').textContent='';doc.querySelector('#failures').textContent='';doc.querySelector('#queueCount').textContent='';doc.querySelector('#template').replaceChildren();doc.querySelector('#resume').replaceChildren();doc.querySelector('#sessionName').setAttribute('value','');download('HealthZIP-offline.html','<!doctype html>\n'+doc.outerHTML,'text/html')};
document.getElementById('export').onclick=()=>download('HealthZIP-private-backup.json',JSON.stringify({...state,token:''},null,2),'application/json');
document.getElementById('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const incoming=JSON.parse(await f.text());if(incoming.version!=='1.3.0'||!Array.isArray(incoming.sessions)||!Array.isArray(incoming.outbox))throw Error('不是本应用的备份');if(!confirm('将替换这台设备的本机草稿，建议先导出当前备份。继续恢复？'))return;state=incoming;state.token='';document.getElementById('token').value='';document.getElementById('base').value=state.base;persist();render()}catch(err){say(err.message,true)}};
document.getElementById('clear').onclick=()=>{if(confirm('仅清除这台设备的本机缓存和待发送事件；电脑数据库不变。是否继续？')){localStorage.removeItem(KEY);indexedDB.deleteDatabase('healthzip.public.media');state=empty();document.getElementById('token').value='';render()}};
render();
cachedMedia('catalog:'+state.catalog_snapshot_id).then(saved=>{if(saved?.catalog){const known=new Set(saved.catalog.map(x=>x.exercise_id));state.catalog=[...saved.catalog,...state.catalog.filter(x=>!known.has(x.exercise_id))];render()}}).catch(()=>{});
</script></body></html>
