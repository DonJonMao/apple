[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "health-zip-workbench"
version = "1.4.0"
description = "Local Apple Health ZIP analysis workbench"
requires-python = ">=3.9"
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.20", "pillow>=10"]
catalog-media = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4"]
research = ["numpy>=1.24", "scipy>=1.10"]
knowledge-pdf = ["pdfplumber>=0.11"]

[project.scripts]
healthzip = "healthzip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"healthzip.db" = ["schema.sql"]
"healthzip.training" = ["*.json"]
"healthzip.ui" = ["*.html", "*.js"]
"healthzip.science" = ["*.json"]
"healthzip.knowledge" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
